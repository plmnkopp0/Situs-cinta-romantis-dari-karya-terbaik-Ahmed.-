<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>الموقع مغلق مؤقتاً</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Font (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #0d0d1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* خلفية مع تدرج وتأثير حركي بسيط */
            background: radial-gradient(circle at 20% 30%, #1a1a2e, #0a0a15);
        }

        .lock-card {
            max-width: 480px;
            width: 100%;
            background: rgba(22, 22, 40, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 48px;
            padding: 40px 28px 36px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: 0.3s;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* الأيقونة الرئيسية */
        .lock-icon {
            font-size: 70px;
            color: #f87171;
            background: rgba(248, 113, 113, 0.12);
            width: 120px;
            height: 120px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 1px solid rgba(248, 113, 113, 0.2);
            box-shadow: 0 0 50px rgba(248, 113, 113, 0.1);
        }

        .lock-icon i {
            filter: drop-shadow(0 0 18px rgba(248, 113, 113, 0.3));
        }

        .main-title {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .main-title i {
            color: #fbbf24;
            margin-left: 6px;
        }

        .sub-message {
            font-size: 18px;
            font-weight: 600;
            color: #c8c8dd;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .sub-message span {
            color: #fca5a5;
        }

        .divider {
            width: 70px;
            height: 3px;
            background: linear-gradient(90deg, #f87171, #fbbf24);
            margin: 16px auto 24px;
            border-radius: 10px;
        }

        .developer-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 24px 18px;
            margin: 18px 0 22px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
        }

        .developer-name {
            font-size: 24px;
            font-weight: 700;
            color: #fbbf24;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .developer-name i {
            color: #6ee7b7;
            font-size: 26px;
        }

        .contact-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.04);
            padding: 14px 18px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            width: fit-content;
            margin: 0 auto;
            transition: 0.3s;
        }

        .contact-info:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(251, 191, 36, 0.3);
        }

        .contact-info i {
            color: #34d399;
            font-size: 22px;
        }

        .contact-info .phone {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            direction: ltr;
            unicode-bidi: embed;
        }

        .contact-info .phone i {
            margin-left: 8px;
            color: #fbbf24;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #94a3b8;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Cairo', sans-serif;
            border: 1px solid transparent;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .copy-btn i {
            font-size: 14px;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 14px;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .footer-note i {
            color: #f87171;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        /* زر عودة (اختياري) */
        .back-home {
            display: inline-block;
            margin-top: 6px;
            color: #94a3b8;
            font-size: 14px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px 22px;
            border-radius: 40px;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.02);
        }

        .back-home:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* للموبايل */
        @media (max-width: 420px) {
            .lock-card {
                padding: 30px 18px 28px;
            }
            .lock-icon {
                width: 90px;
                height: 90px;
                font-size: 50px;
            }
            .main-title {
                font-size: 26px;
            }
            .developer-name {
                font-size: 20px;
            }
            .contact-info .phone {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="lock-card">

        <!-- أيقونة القفل -->
        <div class="lock-icon">
            <i class="fas fa-lock"></i>
        </div>

        <!-- العنوان الرئيسي -->
        <h1 class="main-title">
            <i class="fas fa-globe"></i> الموقع مغلق
        </h1>

        <p class="sub-message">
            تم قفل هذا الموقع <span>لسبب خاص</span>
            <br />
            لتفعيل الموقع مرة أخرى، تواصل مع المطور
        </p>

        <div class="divider"></div>

        <!-- بطاقة المطور -->
        <div class="developer-card">
            <div class="developer-name">
                <i class="fas fa-code"></i> Ahmed Al-Wardani
                <i class="fas fa-check-circle" style="color: #34d399; font-size: 20px;"></i>
            </div>

            <!-- رقم الهاتف مع زر النسخ -->
            <div class="contact-info">
                <i class="fas fa-phone-alt"></i>
                <span class="phone" id="phoneNumber">01027845108</span>
                <button class="copy-btn" onclick="copyPhone()">
                    <i class="fas fa-copy"></i> نسخ
                </button>
            </div>

            <!-- زر تواصل (محاكاة) -->
            <div style="margin-top: 16px;">
                <a href="tel:01027845108" class="back-home" style="background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.2); color: #fbbf24;">
                    <i class="fas fa-phone"></i> اتصل الآن
                </a>
            </div>
        </div>

        <!-- رسالة توضيحية إضافية -->
        <div class="footer-note">
            <i class="fas fa-circle"></i> يرجى التواصل عبر الرقم المذكور
            <i class="fas fa-circle"></i>
        </div>

        <!-- زر تجريبي للعودة (يمكن إزالته) -->
        <div style="margin-top: 12px;">
            <a href="#" class="back-home" onclick="alert('سيتم التوجيه للصفحة الرئيسية بعد التفعيل'); return false;">
                <i class="fas fa-arrow-right"></i> العودة للرئيسية
            </a>
        </div>

    </div>

    <script>
        // دالة نسخ رقم الهاتف
        function copyPhone() {
            const phone = document.getElementById('phoneNumber').innerText;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(phone).then(() => {
                    showToast('📋 تم نسخ الرقم: ' + phone);
                }).catch(() => {
                    fallbackCopy(phone);
                });
            } else {
                fallbackCopy(phone);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('📋 تم نسخ الرقم: ' + text);
            } catch (e) {
                alert('اضغط مع الاستمرار ثم اختر نسخ: ' + text);
            }
            document.body.removeChild(textarea);
        }

        // عرض إشعار بسيط
        function showToast(msg) {
            const old = document.querySelector('.toast-message');
            if (old) old.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.innerText = msg;
            Object.assign(toast.style, {
                position: 'fixed',
                bottom: '30px',
                left: '50%',
                transform: 'translateX(-50%)',
                background: 'rgba(20,20,40,0.95)',
                color: '#fff',
                padding: '14px 28px',
                borderRadius: '60px',
                fontSize: '16px',
                fontWeight: '600',
                backdropFilter: 'blur(12px)',
                border: '1px solid rgba(255,255,255,0.1)',
                boxShadow: '0 12px 40px rgba(0,0,0,0.7)',
                zIndex: '999',
                fontFamily: 'Cairo, sans-serif',
                direction: 'rtl',
                maxWidth: '90%',
                textAlign: 'center',
                animation: 'float 0.3s ease',
            });
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = '0.4s';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // منع أي تفاعل غير مرغوب (اختياري)
        console.log('🔒 الموقع مغلق مؤقتاً - تواصل مع المطور');
    </script>

</body>
</html>
